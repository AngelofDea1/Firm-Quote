<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Firm Quote</title>
    <meta name="description" content="Staked AI underwriting with AI priced exit liquidity for tokenised real world credit. The model posts collateral behind every score, and a standing pool honours your exit price on demand. Built on X Layer." />
    <meta name="theme-color" content="#ffffff" />

    <!-- Social preview.
         There was a <link rel="canonical"> here pointing at firmquote.xyz, a domain
         nobody owns. A canonical tag tells search engines "the real version of this
         page lives over there", so pointing it at a domain you do not control is
         worse than having none. Removed until there is a real domain to name.

         og:image should ideally be absolute, but a relative path is honoured by the
         major scrapers and, unlike a hardcoded domain, it is correct on every host
         this gets deployed to. Replace both with absolute URLs once the domain is
         settled. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Firm Quote" />
    <meta property="og:title" content="Firm Quote" />
    <meta property="og:description" content="The model posts collateral behind every score, and a standing pool honours your exit price on demand." />
    <meta property="og:image" content="/logo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Firm Quote" />
    <meta name="twitter:description" content="The model posts collateral behind every score, and a standing pool honours your exit price on demand." />
    <meta name="twitter:image" content="/logo.jpg" />
    <meta name="twitter:image:alt" content="Firm Quote. The model posts collateral behind every score." />

    <link rel="icon" type="image/jpeg" href="/logo.jpg" />

    <!-- Webfonts are loaded without blocking render, so a slow or blocked CDN cannot leave the
         page invisible. The stack in index.css falls back to system fonts if these never
         arrive, which is what happens on conference wifi. See the README for self hosting. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="max-width:640px;margin:14vh auto;padding:32px;font:16px/1.6 system-ui,sans-serif;color:#111">
        <h1 style="font-size:28px;letter-spacing:-0.02em;margin:0 0 12px">Firm Quote</h1>
        <p style="color:#555;margin:0 0 12px">
          AI credit opinions that are firm, not indicative. The model posts collateral behind every
          score, and a standing pool honours your exit price on demand.
        </p>
        <p style="color:#555;margin:0">
          This site needs JavaScript to run. Please enable it, or read the project documentation in
          the repository instead.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
